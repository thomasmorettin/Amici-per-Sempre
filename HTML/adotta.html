<main>

            <div class="hero">
                <h2>Cerchi un cane o un gatto da adottare?</h2>
                <p>Nel nostro rifugio a Padova puoi trovare cani e gatti in adozione di tutte le età e taglie.</p>
            </div>

            <div class="list-topbar">
                <button id="filtra-btn" aria-label="Filtra cani e gatti per tipo, età e taglia">
                    Filtra
                </button>
            </div>

            <section class="section-list">
                <div class="filter-panel">
                    <div class="filter-content">
                        <form method="GET" action="[project_root]/adotta.php">
                            <div class="accordion">
                                <div class="accordion-header">
                                    <div class="legend-left"></div>
                                    <div class="header">
                                        <p>Tipo animale</p>
                                        <span class="header-arrow"></span>
                                    </div>
                                    <div class="legend-right"></div>
                                </div>
                                <div class="content">
                                    <div class="inner-content form-field">
                                        <div class="check-group">
                                            <label for="cane">
                                                <input type="checkbox" id="cane" name="tipo[]" value="Cane" [checked_cane]>Cane
                                            </label>
                                            <label for="gatto">
                                                <input type="checkbox" id="gatto" name="tipo[]" value="Gatto" [checked_gatto]>Gatto
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="accordion">
                                <div class="accordion-header">
                                    <div class="legend-left"></div>
                                    <div class="header">
                                        <p>Dati animale</p>
                                        <span class="header-arrow"></span>
                                    </div>
                                    <div class="legend-right"></div>
                                </div>
                                <div class="content">
                                    <div class="inner-content">
                                        <div class="form-field">
                                            <label>Nome</label>
                                            <input type="text" name="nome" value="[filter_nome]" placeholder="Cerca per nome">
                                        </div>
                                        <div class="form-field">
                                            <label>Peso (> kg)</label>
                                            <div class="form-slider">
                                                <input type="text" name="peso_display" value="[filter_peso]" readonly>
                                                <input type="range" name="peso" min="1" max="100" value="[filter_peso]">
                                            </div>
                                        </div> 
                                        <div class="form-field">
                                            <label>Età (> anni)</label>
                                            <div class="form-slider">
                                                <input type="text" name="eta_display" value="[filter_eta]" readonly>
                                                <input type="range" name="eta" min="1" max="20" value="[filter_eta]">
                                            </div>
                                        </div>
                                        <button type="submit">
                                            Applica filtri
                                        </button>
                                    </div>
                                </div>
                            </div> 
                        </form>
                    </div>
                    <span class="divider"></span>
                </div>  
        
                <div class="list-vertical-panel">
                    <div class="list-panel">
                        <section id="animal-container">
                            <ul class="animal-list">
                                [lista_animali]
                            </ul>
                        </section>
                    </div>
                </div>
            </section>
</main>
