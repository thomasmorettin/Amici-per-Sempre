<dialog id="dia-cancellazione" aria-labelledby="tit-dia-can" aria-modal="true">
    <h3 id="tit-dia-can" class="titolo-dialog">Cancella appuntamento</h3>
    <p><abbr title="Signore o signora">Sig/ra.</abbr>&nbsp;<span class="nome-cliente"></span></p>

    <div id="msg-warning">
        <p><span class="red"><strong>Attenzione</strong></span>, si vuole eliminare l'appuntamento in giornata <span id="data-app" class="bold"></span> alle ore <span id="ora-app" class="bold"></span>.</p>
        <p>L'appuntamento è riprenotabile alla pagina <a href="{{root}}/amministrazione/{{where-link}}.php">Gestione richieste</a>.</p>
    </div>

    <button class="btn-close" aria-label="chiudi finestra modale">
        <svg aria-hidden="true">
            <use href="{{root}}/Resources/icons.svg#cancel"></use>
        </svg>
    </button>

    <form action="{{root}}/PHP/Controller/{{funzione}}" method="POST">
        <input type="hidden" id="hidden-id-del" name="id">
        <input type="hidden" id="hidden-data-del" name="data">
        <input type="hidden" id="hidden-ora-del" name="ora">

        <button type="submit" id="btn-cancella-app">Cancella appuntamento</button>
    </form>
</dialog>
