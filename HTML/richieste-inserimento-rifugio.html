<main>
    <p class="titolo">Richieste inserimento animali in rifugio</p>
    {{pannello-controllo-filtri}}
    <section class="section-list">
        {{pannello-filtri}}
        <div class="list-vertical-panel">
            <ul id="lst-animali">
                {{lista-animali}}
            </ul>
        </div>
    </section>
</main>

<dialog id="dia-appuntamento" aria-labelledby="tit-dia-app" aria-modal="true">
    <h3 id="tit-dia-app" class="titolo-dialog">Programma appuntamento</h3>
    <p>Sig/ra. <span class="nome-cliente"></span></p>

    <div class="info-required">
        <p>Campo obbligatorio</p>
    </div>

    <button class="btn-close" aria-label="chiudi finestra modale">
        <svg aria-hidden="true">
            <use href="{{root}}/Resources/icons.svg#cancel"></use>
        </svg>
    </button>

    <form id="frm-app" action="{{root}}/PHP/Controller/aggiungi-appuntamento" method="POST" novalidate>
        <div id="campi-input">
            <input type="hidden" id="hidden-id" name="id">

            <div>
                <label for="data-appuntamento">Data</label>
                <input type="date" id="data-appuntamento" name="data" required aria-describedby="msg-errore-app" aria-label="giorno, mese, anno">
            </div>

            <div>
                <label for="ora-appuntamento">Ora&nbsp;<span class="normal">(08:30 - 19:30)</span></label>
                <input type="time" id="ora-appuntamento" name="ora" min="08:30" max="19:30" required aria-describedby="msg-errore-app">
            </div>
        </div>

        <span id="msg-errore-app" class="field-error hidden" role="alert"></span>

        <button type="submit" id="btn-prenota-app">Salva appuntamento</button>
    </form>
</dialog>

<dialog id="dia-cancellazione" aria-labelledby="tit-dia-can">
    <h3 id="tit-dia-can" class="titolo-dialog">Elimina richiesta</h3>
    <p>Sig/ra. <span class="nome-cliente"></span></p>

    <div id="msg-warning">
        <p><span class="red"><strong>Attenzione</strong></span>, si sta per eliminare definitivamente la richiesta dell'utente.</p>
        <p class="bold">L'azione è irreversibile.</p>
    </div>

    <button class="btn-close" aria-label="chiudi finestra modale">
        <svg aria-hidden="true">
            <use href="{{root}}/Resources/icons.svg#cancel"></use>
        </svg>
    </button>

    <form action="{{root}}/PHP/Controller/elimina-richiesta" method="POST">
        <input type="hidden" id="hidden-id-del" name="id">
        <button type="submit" id="btn-cancella-app">Elimina richiesta</button>
    </form>
</dialog>
