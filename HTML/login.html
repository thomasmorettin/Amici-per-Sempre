<main>
    <p class="titolo">Accedi</p>
    <section id="section-form-login">
        <div class="info-required">
            <p>Campo obbligatorio</p>
        </div>
        <form id="form-login" method="POST" action="{{root}}/PHP/Controller/avvia-accesso"> 
            <div class="form-field">
                <label for="username" class="required">
                    Username
                </label>
                <input type="text" id="username" name="username" placeholder="Es. user1234" aria-describedby="error-username" required>
                <div id="error-username" class="field-error hidden" role="alert" aria-atomic="true">
                    <svg class="warning" aria-hidden="true">
                        <use href="{{root}}/Resources/icons.svg#warning"></use>
                    </svg>
                    <span class="error-text"></span>
                </div>
            </div>
            <div class="form-field">
                <label for="password" class="required">
                    Password
                </label>
                <input type="password" id="password" name="password" placeholder="Es. password1234" required>
                <div id="error-password" class="field-error hidden" role="alert" aria-atomic="true">
                    <svg class="warning" aria-hidden="true">
                        <use href="{{root}}/Resources/icons.svg#warning"></use>
                    </svg>
                    <span class="error-text"></span>
                </div>
            </div>
            <div class="form-field">
                <button type="submit">Accedi</button>
            </div>
        </form>
    </section>
</main>
