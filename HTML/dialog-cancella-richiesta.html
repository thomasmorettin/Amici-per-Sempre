<dialog id="dia-cancellazione" aria-labelledby="tit-dia-can" aria-modal="true">
    <p id="tit-dia-can" class="titolo-dialog">Elimina richiesta</p>
    <p><abbr title="Signore o signora">Sig/ra.</abbr>&nbsp;<span class="nome-cliente"></span></p>

    <div id="msg-warning">
        <p><span class="red"><strong>Attenzione</strong></span>, si sta per eliminare definitivamente la richiesta dell'utente.</p>
        <p class="bold">L'azione è irreversibile.</p>
    </div>

    <button class="btn-close" aria-label="chiudi finestra modale">
        <svg aria-hidden="true">
            <use href="{{root}}/Resources/icons.svg#cancel"></use>
        </svg>
    </button>

    <form action="{{root}}/PHP/Controller/{{funzione}}" method="POST">
        <input type="hidden" id="hidden-id-del" name="id">
        <input type="hidden" name="redirect-to" value="{{URI}}">

        <button type="submit" id="btn-cancella-app">Elimina richiesta</button>
    </form>
</dialog>
