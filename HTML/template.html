<!DOCTYPE html>
<html lang="it" data-theme="light">
    <head>
        <title>{{current-page}}: Amici per Sempre</title>

        <!-- META TAGS -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="{{page-description}}">
        <meta name="keywords" content="{{page-keywords}}">

        <!-- SOCIAL SEO -->
        <meta property="og:title" content="Adotta, o porta in adozione, un amico al Rifugio Amici per Sempre - Padova">
        <meta property="og:description" content="Non lasciarli soli. Scopri i cani e i gatti in cerca di casa e le loro storie.">
        <meta property="og:image" content="{{root}}/Resources/Images/Operatori.jpg">
        <meta property="og:url" content="{{root}}">
        <meta property="og:type" content="website">
        <meta property="og:locale" content="it_IT">

        <!-- ICON PER TAB -->
        <link rel="icon" type="image/png" href="{{root}}/Resources/Favicon/favicon-96x96.png" sizes="96x96">
        <link rel="icon" type="image/svg+xml" href="{{root}}/Resources/Favicon/favicon.svg">
        <link rel="shortcut icon" href="{{root}}/Resources/Favicon/favicon.ico">
        <link rel="apple-touch-icon" sizes="180x180" href="{{root}}/Resources/Favicon/apple-touch-icon.png">
        <meta name="apple-mobile-web-app-title" content="Amici Per Sempre">
        <link rel="manifest" href="{{root}}/Resources/Favicon/site.webmanifest">

        <!-- FILE DI STYLESHEET -->
        <link rel="stylesheet" href="{{root}}/CSS/style-thomas.css">
        <link rel="stylesheet" href="{{root}}/CSS/style-niccolo.css">
        <link rel="stylesheet" href="{{root}}/CSS/style-felix.css">
        <link rel="stylesheet" href="{{root}}/CSS/style-smartphone-t.css" media="screen and (max-width: 768px)">
        <link rel="stylesheet" href="{{root}}/CSS/style-smartphone-n.css" media="screen and (max-width: 768px)">
        <link rel="stylesheet" href="{{root}}/CSS/style-smartphone-f.css" media="screen and (max-width: 768px)">
        <link rel="stylesheet" href="{{root}}/CSS/style-print-t.css" media="print">
        <link rel="stylesheet" href="{{root}}/CSS/style-print-n.css" media="print">
        <link rel="stylesheet" href="{{root}}/CSS/style-print-f.css" media="print">

        <!-- FILE DI JS -->
        <script>const PROJECT_ROOT = "{{root}}";</script>
        <script src="{{root}}/JavaScript/storage.js"></script>
        <script src="{{root}}/JavaScript/global.js" defer></script>
        <script type="{{type-script}}" src="{{root}}/JavaScript/{{current-js}}" defer></script>
        {{extra-js}}

        <!-- GOOGLE FONT: INTER -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    </head>

    <body {{data-page}}>
        {{header}}

        {{breadcrumb}}

        <output id="toast-not" class="hidden" role="alert" aria-live="assertive" aria-atomic="true" tabindex="0">
            <span></span>
        </output>

        {{main}}

        {{footer}}

        <button id="btn-back-to-top" title="Torna in cima" aria-label="torna in cima alla pagina">
            <svg aria-hidden="true">
                <use href="{{root}}/Resources/icons.svg#arrow"></use>
            </svg>
        </button>
    </body>
</html>
