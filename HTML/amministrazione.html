<main>
    <div class="contenitore">
        <h2 class="titolo">Area amministrativa</h2>

        <section id="benvenuto" aria-labelledby="ben-time">
            <div>
                <p id="ben-time">Buongiorno</p>

                <p>Oggi è <span id="ben-date">00/00/0000</span></p>
                <p id="polite-app"><span id="num-app">{{num-app}}</span> <span id="app">appuntamenti</span> in programma</p>
            </div>

            <svg id="dog-house" aria-hidden="true">
                <use href="{{root}}/Resources/icons.svg#dog-house"></use>
            </svg>
        </section>

        <section id="section-links" aria-label="link rapidi di gestione">
            <ul>
                <li>
                    <span id="cal-not" aria-label="calendario: {{num-app}} notifiche">{{num-app}}</span>
                    <a class="btn-link" href="{{root}}/amministrazione/calendario">
                        <svg aria-hidden="true">
                            <use href="{{root}}/Resources/icons.svg#calendario"></use>
                        </svg>
                        <span>Calendario</span>
                    </a>
                </li>

                <li>
                    <span id="ticket-not" aria-label="richieste adozione: {{num-tck}} notifiche">{{num-tck}}</span>
                    <a class="btn-link" href="{{root}}/amministrazione/gestione-ticket">
                        <svg aria-hidden="true">
                            <use href="{{root}}/Resources/icons.svg#cuore"></use>
                        </svg>
                        <span>Richieste adozione</span>
                    </a>
                </li>

                <li>
                    <span id="proposte-not" aria-label="richieste inserimento: {{num-req}} notifiche">{{num-req}}</span>
                    <a class="btn-link" href="{{root}}/amministrazione/richieste-inserimento-rifugio">
                        <svg aria-hidden="true">
                            <use href="{{root}}/Resources/icons.svg#domanda"></use>
                        </svg>
                        <span>Richieste inserimento</span></a>
                </li>
            </ul>
        </section>
    </div>
</main>
