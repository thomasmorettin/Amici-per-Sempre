<main>
    <div class="contenitore">
        <p class="titolo">Area amministrativa</p>

        <section id="benvenuto">
            <div>
                <p id="ben-time">Buongiorno</p>

                <p>Oggi è <span id="ben-date">00/00/0000</span></p>
                <p><span id="num-app">{{num-app}}</span> <span id="app">appuntamenti</span> in programma</p>
            </div>

            <svg id="dog-house">
                <use href="{{root}}/Resources/icons.svg#dog-house"></use>
            </svg>
        </section>

        <section id="section-links">
            <ul>
                <li>
                    <span id="cal-not">{{num-app}}</span>
                    <a class="btn-link" href="{{root}}/amministrazione/calendario">
                        <svg>
                            <use href="{{root}}/Resources/icons.svg#calendario"></use>
                        </svg>
                        <span>Calendario</span>
                    </a>
                </li>

                <li>
                    <span id="ticket-not">{{num-tck}}</span>
                    <a class="btn-link" href="{{root}}/amministrazione/gestione-ticket">
                        <svg>
                            <use href="{{root}}/Resources/icons.svg#cuore"></use>
                        </svg>
                        <span>Richieste adozione</span>
                    </a>
                </li>

                <li>
                    <span id="proposte-not">{{num-req}}</span>
                    <a class="btn-link" href="{{root}}/amministrazione/richieste-inserimento-rifugio"><svg>
                            <use href="{{root}}/Resources/icons.svg#domanda"></use>
                        </svg>
                        <span>Richieste inserimento</span></a>
                </li>
            </ul>
        </section>
    </div>
</main>
